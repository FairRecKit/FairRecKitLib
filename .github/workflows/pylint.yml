name: Pylint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - stable
  schedule:
    - cron: '0 0 * * *'

jobs:
  full-lint:
    name: Full Lint
    runs-on: ubuntu-latest

    env:
      # Set PYTHONPATH so Python and pylint can find src/
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9.x'
        
    #- uses: actions/cache@v5
    #  with:
    #    path: ${{ env.pythonLocation }}
    #    key: ${{ env.pythonLocation }}-${{ hashFiles('setup.py') }}-${{ hashFiles('requirements.txt') }}

    - name: Force install pip 23.2.1 using get-pip.py
      run: python -m pip install --upgrade pip==23.2.1

    #- name: Confirm pip version
    #  run: pip --version

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .

    - name: Analysing the code with pylint
      run: |
        # Disable W0511 (TODO/fixme) to avoid failing CI on these
        PYLINT_OPTIONS="--disable=W0511 --fail-on=E --fail-under=9"

        echo "Running pylint on src/fairreckitlib..."
        pylint src/fairreckitlib $PYLINT_OPTIONS || PYLINT_EXIT=$?
        PYLINT_EXIT=${PYLINT_EXIT:-0}
        echo "Pylint exit code for library: $PYLINT_EXIT"

        echo "Running pylint on tests..."
        PYTHONPATH="${{ github.workspace }}/src"
        pylint tests $PYLINT_OPTIONS || PYLINT_TEST_EXIT=$?
        PYLINT_TEST_EXIT=${PYLINT_TEST_EXIT:-0}
        echo "Pylint exit code for tests: $PYLINT_TEST_EXIT"

        # Only fail if there are real errors (E) or score < 9
        if [[ $PYLINT_EXIT -eq 2 || $PYLINT_TEST_EXIT -eq 2 ]]; then
          echo "Pylint reported errors. Failing job."
          exit 2
        fi

        echo "Linting completed. Warnings like TODOs ignored."
