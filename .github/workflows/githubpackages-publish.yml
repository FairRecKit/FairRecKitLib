name: Upload to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  packages: write
  contents: read

jobs:
  publish-to-github-packages:
    name: Publish Python distribution to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution (wheel + sdist)
        run: python -m build

      - name: Configure pypirc for GitHub Packages
        run: |
          cat > ~/.pypirc << EOF
          [distutils]
          index-servers =
              github

          [github]
          repository = https://upload.github.com/FairRecKit/FairRecKitLib/packages/python/
          username = ${{ github.actor }}
          password = ${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Publish to GitHub Packages
        run: |
          python -m twine upload --repository github dist/*
